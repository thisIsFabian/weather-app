<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="shortcut icon" type="image/x-icon" href="#">

		<link rel="stylesheet" type="text/css" href="style/css/main.min.css">
		
		<title>weather-app</title>
	</head>
	<body>
		
		<div id="content">
			<header>
				<div>
					<form id="searchbar_form">
						<input id="searchbar" type="text" autocomplete="off" placeholder="Search...">
					</form>
					<div id="search_suggestions">
						<hr class="divider">
						<div id="search_suggestions_content">
						</div>
					</div>
				</div>
			</header>
			<main>
				<div id="weather">

				</div>
				<div id="info_grid">
					<div class="grid_item wide" id="moon_tile">
						<div class="altitude_graph">
							<svg id="graphSVG" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg"></svg>
						</div>
						<div class="stats">
							<div class="stat_item">
								<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 9-6-6-6 6"/><path d="M12 3v14"/><path d="M5 21h14"/></svg>
								<span class="moon_rise">-</span>
							</div>
							<div class="stat_item">
								<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>
								<span class="moon_set">-</span>
							</div>
							<div class="stat_item">
								<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
								<span class="moon_illumination">-</span>
							</div>
							<div class="stat_item">
								<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/></svg>
								<span class="moon_size">-</span>
							</div>
							<div class="stat_item">
								<svg xmlns="http://www.w3.org/2000/svg" class="moon_direction_arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6L12 2L16 6"/><path d="M12 2V22"/></svg>
								<span class="moon_direction">-</span>
							</div>
						</div>
					</div>
					<div class="grid_item"></div>
					<div class="grid_item"></div>
				</div>
			</main>
		</div>
        
        <script type="module" src="js/weather_app/main.js"></script>
	</body>
</html>
